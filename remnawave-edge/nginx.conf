user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

stream {
    map $ssl_preread_server_name $tls_backend {
        panel-verizon.bigpandas.top 127.0.0.1:11443;
        sub-verizon.bigpandas.top   127.0.0.1:11443;
        rw-panel.bigpandas.top      127.0.0.1:11443;
        rw-sub.bigpandas.top        127.0.0.1:11443;
        verizon.bigpandas.top       127.0.0.1:30443;
        cstonecloud.bigpandas.top   127.0.0.1:30443;
        default                     127.0.0.1:9;
    }

    server {
        listen 443 reuseport;
        listen [::]:443 reuseport;
        proxy_pass $tls_backend;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_socket_keepalive on;
        ssl_preread on;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 127.0.0.1:18080;
        server_name verizon.bigpandas.top cstonecloud.bigpandas.top;
        root /usr/share/nginx/decoy;
        index index.html;

        location = / {
            try_files /index.html =404;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name panel-verizon.bigpandas.top sub-verizon.bigpandas.top
                    rw-panel.bigpandas.top rw-sub.bigpandas.top;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name verizon.bigpandas.top cstonecloud.bigpandas.top _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    server {
        listen 127.0.0.1:11443 ssl;
        http2 on;
        server_name panel-verizon.bigpandas.top rw-panel.bigpandas.top;

        ssl_certificate /etc/letsencrypt/live/remnawave-domains/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/remnawave-domains/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:PANEL_TLS:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location ~ ^/(app|modern)(/|$) {
            return 410;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
        }
    }

    server {
        listen 127.0.0.1:11443 ssl;
        http2 on;
        server_name sub-verizon.bigpandas.top rw-sub.bigpandas.top;

        ssl_certificate /etc/letsencrypt/live/remnawave-domains/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/remnawave-domains/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SUB_TLS:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Profile-Update-Interval "1" always;

        # The Remnawave short UUID is the only public subscription format.
        # Resolve it directly to the Mihomo renderer so clients receive YAML,
        # never the Subscription Page HTML.
        location ~ "^/[A-Za-z0-9_-]{16}$" {
            rewrite ^/([^/]+)$ /api/sub/$1/mihomo break;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
        }

        # Extensions are intentionally not part of the public format.
        location ~ "^/[A-Za-z0-9_-]{16}\.(yaml|yml)$" {
            return 410;
        }

        # Retire legacy s-ui-style public subscription paths.
        location ~ ^/(sub|json|clash)(/|$) {
            return 410;
        }
        location ~ ^/[^/]+/clash$ {
            return 410;
        }

        location = /shadowrocket {
            return 302 https://$host/shadowrocket/config.conf;
        }

        location ^~ /shadowrocket/ {
            root /usr/share/nginx;
            try_files $uri =404;
            default_type text/plain;
            charset utf-8;
            add_header Cache-Control "no-cache" always;
            add_header Profile-Update-Interval "1" always;
        }

        # Keep the backend API available for internal compatibility and existing
        # panel integrations. User-facing links should use /<short-uuid>.
        location ^~ /api/sub/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
        }

        location / {
            return 404;
        }
    }
}
