user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

stream {
    map $ssl_preread_server_name $tls_backend {
        panel-verizon.bigpandas.top 127.0.0.1:11443;
        sub-verizon.bigpandas.top   127.0.0.1:11443;
        rw-panel.bigpandas.top      127.0.0.1:11443;
        rw-sub.bigpandas.top        127.0.0.1:11443;
        verizon.bigpandas.top       127.0.0.1:30443;
        cstonecloud.bigpandas.top   127.0.0.1:30443;
        default                     127.0.0.1:9;
    }

    server {
        listen 443 reuseport;
        listen [::]:443 reuseport;
        proxy_pass $tls_backend;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_socket_keepalive on;
        ssl_preread on;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 127.0.0.1:18080;
        server_name verizon.bigpandas.top cstonecloud.bigpandas.top;
        root /usr/share/nginx/decoy;
        index index.html;

        location = / {
            try_files /index.html =404;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name panel-verizon.bigpandas.top sub-verizon.bigpandas.top
                    rw-panel.bigpandas.top rw-sub.bigpandas.top;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name verizon.bigpandas.top cstonecloud.bigpandas.top _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    server {
        listen 127.0.0.1:11443 ssl;
        http2 on;
        server_name panel-verizon.bigpandas.top rw-panel.bigpandas.top;

        ssl_certificate /etc/letsencrypt/live/remnawave-domains/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/remnawave-domains/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:PANEL_TLS:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location ~ ^/(app|modern)(/|$) {
            return 410;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
        }
    }

    server {
        listen 127.0.0.1:11443 ssl;
        http2 on;
        server_name sub-verizon.bigpandas.top rw-sub.bigpandas.top;

        ssl_certificate /etc/letsencrypt/live/remnawave-domains/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/remnawave-domains/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SUB_TLS:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Profile-Update-Interval "1" always;

        # Direct YAML aliases. These bypass the Subscription Page and proxy the
        # authenticated backend renderer, so the URL body is YAML rather than HTML.
        location ~ ^/clash/([A-Za-z0-9_-]+)\.(yaml|yml)$ {
            set $yaml_download_name "subscription.yaml";
            rewrite ^/clash/([^/.]+)\.(?:yaml|yml)$ /api/sub/$1/mihomo break;
            proxy_hide_header Content-Disposition;
            add_header Content-Disposition 'attachment; filename="subscription.yaml"' always;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }

        location ~ ^/([A-Za-z0-9_-]+)\.(yaml|yml)$ {
            rewrite ^/([^/.]+)\.(?:yaml|yml)$ /api/sub/$1/mihomo break;
            proxy_hide_header Content-Disposition;
            add_header Content-Disposition 'attachment; filename="subscription.yaml"' always;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }

        # s-ui-compatible alias: /clash/<short-uuid> -> /<short-uuid>/mihomo.
        # Keep the token in the path, but always use the maintained Mihomo renderer.
        location ~ ^/clash/([A-Za-z0-9_-]+)$ {
            rewrite ^/clash/([^/]+)$ /$1/mihomo last;
        }

        location ~ ^/(sub|json|clash)(/|$) {
            return 410;
        }

        location = /shadowrocket {
            return 302 https://$host/shadowrocket/config.conf;
        }

        location ^~ /shadowrocket/ {
            root /usr/share/nginx;
            try_files $uri =404;
            default_type text/plain;
            charset utf-8;
            add_header Cache-Control "no-cache" always;
            add_header Profile-Update-Interval "1" always;
        }

        # Keep links issued before the official subscription page deployment valid.
        location ^~ /api/sub/ {
            rewrite ^(/api/sub/[^/]+)/clash$ $1/mihomo last;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
        }

        # Some mobile Clash clients append /clash to the saved subscription URL.
        # The legacy CLASH renderer cannot expand Remnawave-managed proxies, so
        # route that explicit suffix to the maintained Mihomo renderer.
        location ~ ^/([^/]+)/clash$ {
            rewrite ^/([^/]+)/clash$ /$1/mihomo last;
        }

        location / {
            proxy_pass http://127.0.0.1:3010;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
        }
    }
}
