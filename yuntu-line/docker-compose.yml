services:
  relay:
    image: haproxy:2.8-alpine@sha256:68d20e9f9f1d825c4eb8e72a80e36643bb84bf3ffa61bb1059b804f69700a83a
    container_name: yuntu-line-relay
    user: "0:0"
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run:rw,noexec,nosuid,size=16m
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    pids_limit: 128
    mem_limit: 96m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg >/dev/null && nc -z 127.0.0.1 443"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 30s

  udp-relay:
    image: gogost/gost:3.2.6
    container_name: yuntu-udp-relay
    network_mode: host
    restart: unless-stopped
    command:
      - -L
      - udp://:443/47.178.15.216:34443?keepalive=true&ttl=60s&readBufferSize=65535
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  hy2-relay:
    image: gogost/gost:3.2.6
    container_name: yuntu-hy2-relay
    network_mode: host
    restart: unless-stopped
    command:
      - -L
      - udp://:2443/127.0.0.1:33444?keepalive=true&ttl=60s&readBufferSize=65535
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  hy2-test-relay:
    image: gogost/gost:3.2.6
    container_name: yuntu-hy2-test-relay
    network_mode: host
    restart: unless-stopped
    command:
      - -L
      - udp://:444/47.178.15.216:34443?keepalive=true&ttl=60s&readBufferSize=65535
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 64
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
