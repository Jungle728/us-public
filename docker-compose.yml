services:
  relay:
    image: haproxy:2.8-alpine@sha256:68d20e9f9f1d825c4eb8e72a80e36643bb84bf3ffa61bb1059b804f69700a83a
    container_name: aaitr-line-relay
    user: "0:0"
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run:rw,noexec,nosuid,size=16m
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    pids_limit: 128
    mem_limit: 96m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg >/dev/null && nc -z 127.0.0.1 443"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 30s

  udp-relay:
    image: gogost/gost:3.2.6@sha256:d0256552878ff6c0ffddae16236aa0a61c27b8311263c1a48cbe3128cf1e0af7
    container_name: aaitr-udp-relay
    network_mode: host
    restart: unless-stopped
    command:
      - -L
      - udp://:443/99.88.84.197:32443?keepalive=true&ttl=60s&readBufferSize=65535
      - -L
      - udp://:10443/99.88.84.197:34443?keepalive=true&ttl=60s&readBufferSize=65535
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 30s

  yuntu-exit:
    image: ghcr.io/sagernet/sing-box:v1.13.0@sha256:d12357595495228bd673b4b3ef8d882c774ce7c4369bd22e89a2761029c53758
    container_name: yuntu-exit-sing-box
    network_mode: host
    restart: unless-stopped
    command:
      - run
      - -c
      - /etc/sing-box/config.json
    read_only: true
    volumes:
      - ./yuntu-exit/config.json:/etc/sing-box/config.json:ro
      - ./yuntu-exit/cert:/etc/sing-box/cert:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 128m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "sing-box", "check", "-c", "/etc/sing-box/config.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 30s
