user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

stream {
    map "$ssl_preread_server_name:$remote_addr" $tls_backend {
        ~^panel\.bigpandas\.top: 127.0.0.1:11443;
        ~^sub\.bigpandas\.top:   127.0.0.1:11443;

        ~^yuntu\.bigpandas\.top: 127.0.0.1:31444;
        ~^proxy\.bigpandas\.top: 127.0.0.1:31444;
        default                  127.0.0.1:31443;
    }

    server {
        listen 443 reuseport;
        listen [::]:443 reuseport;
        proxy_pass $tls_backend;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_socket_keepalive on;
        ssl_preread on;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name panel.bigpandas.top sub.bigpandas.top;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name proxy.bigpandas.top yuntu.bigpandas.top _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    server {
        listen 127.0.0.1:11443 ssl;
        http2 on;
        server_name panel.bigpandas.top;

        ssl_certificate /etc/letsencrypt/live/s-ui-domains/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/s-ui-domains/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:PANEL_TLS:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Profile-Update-Interval "1" always;

        location / {
            proxy_pass http://127.0.0.1:3095;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
        }
    }

    server {
        listen 127.0.0.1:11443 ssl;
        http2 on;
        server_name sub.bigpandas.top;

        ssl_certificate /etc/letsencrypt/live/s-ui-domains/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/s-ui-domains/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SUB_TLS:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        # The forward-proxy account is managed in s-ui but must never be
        # downloadable through the public subscription service.
        location = /sub/sub2api01 { return 404; }
        location = /json/sub2api01 { return 404; }
        location = /clash/sub2api01 { return 404; }

        location ^~ /sub/ {
            proxy_pass http://127.0.0.1:3096;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_hide_header Profile-Update-Interval;
            add_header Profile-Update-Interval "1" always;
            proxy_read_timeout 60s;
        }

        location ~ ^/json/(.+)$ {
            proxy_pass http://127.0.0.1:3096/sub/$1?format=json;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "";
            proxy_hide_header Profile-Update-Interval;
            add_header Profile-Update-Interval "1" always;
            sub_filter_once off;
            sub_filter_types *;
            sub_filter "1.yuntu-reality-yuntu-aaitr" "yuntu-aaitr-reality";
            sub_filter "2.yuntu-reality-aaitr-exit" "aaitr-exit-reality";
            sub_filter "3.yuntu-reality-yuntu-exit" "yuntu-exit-reality";
            sub_filter "1.yuntu-hysteria2-yuntu-aaitr" "yuntu-aaitr-hy2";
            sub_filter "2.yuntu-hysteria2-aaitr-exit" "aaitr-exit-hy2";
            sub_filter "3.yuntu-hysteria2-yuntu-exit" "yuntu-exit-hy2";
            sub_filter "1.yuntu-anytls-yuntu-aaitr" "yuntu-aaitr-anytls";
            sub_filter "2.yuntu-anytls-aaitr-exit" "aaitr-exit-anytls";
            sub_filter "3.yuntu-anytls-yuntu-exit" "yuntu-exit-anytls";
        }

        location ~ ^/clash/(.+)$ {
            proxy_pass http://127.0.0.1:3096/sub/$1?format=clash;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "";
            proxy_hide_header Profile-Update-Interval;
            add_header Profile-Update-Interval "1" always;
            sub_filter_once off;
            sub_filter_types *;
            sub_filter "1.yuntu-reality-yuntu-aaitr" "yuntu-aaitr-reality";
            sub_filter "2.yuntu-reality-aaitr-exit" "aaitr-exit-reality";
            sub_filter "3.yuntu-reality-yuntu-exit" "yuntu-exit-reality";
            sub_filter "1.yuntu-hysteria2-yuntu-aaitr" "yuntu-aaitr-hy2";
            sub_filter "2.yuntu-hysteria2-aaitr-exit" "aaitr-exit-hy2";
            sub_filter "3.yuntu-hysteria2-yuntu-exit" "yuntu-exit-hy2";
            sub_filter "1.yuntu-anytls-yuntu-aaitr" "yuntu-aaitr-anytls";
            sub_filter "2.yuntu-anytls-aaitr-exit" "aaitr-exit-anytls";
            sub_filter "3.yuntu-anytls-yuntu-exit" "yuntu-exit-anytls";
        }

        location / {
            return 404;
        }
    }
}
