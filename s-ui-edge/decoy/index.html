<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Welcome</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #202428;
        background: #f4f6f7;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 520px);
        padding: 32px;
        border: 1px solid #d9dee1;
        border-radius: 6px;
        background: #ffffff;
        box-shadow: 0 12px 32px rgb(32 36 40 / 8%);
      }
      h1 { margin: 0 0 12px; font-size: 28px; font-weight: 650; }
      p { margin: 0; color: #586169; line-height: 1.6; }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
        color: #25683c;
        font-size: 14px;
        font-weight: 600;
      }
      .status::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #32a852;
        content: "";
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status">Online</div>
      <h1>Welcome</h1>
      <p>The site is available and operating normally.</p>
    </main>
  </body>
</html>
