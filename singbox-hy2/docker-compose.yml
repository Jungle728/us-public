services:
  hy2:
    image: ghcr.io/sagernet/sing-box:v1.13.15@sha256:4aa30343cea6b5407960f99b36ffa653403d9ddcb1fc2800c9fb85a1bd77d6d8
    container_name: remnawave-singbox-hy2
    network_mode: host
    restart: unless-stopped
    read_only: true
    command:
      - run
      - -c
      - /etc/sing-box/config.json
    volumes:
      - ./config.json:/etc/sing-box/config.json:ro
      - ../remnawave-edge/letsencrypt:/etc/letsencrypt:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "sing-box", "check", "-c", "/etc/sing-box/config.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
