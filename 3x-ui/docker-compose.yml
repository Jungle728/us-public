services:
  x-ui:
    image: ghcr.io/mhsanaei/3x-ui:v3.4.2@sha256:82a85024db9695c90c5824aa1943851ae4a79963f7e31d24824d9851141d4e14
    container_name: 3x-ui
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "false"
      XUI_PORT: "2053"
    volumes:
      - ./data:/etc/x-ui
      - ./logs:/var/log/x-ui
      - ./mihomo-template.yaml:/opt/templates/mihomo-template.yaml:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null --max-time 5 http://127.0.0.1:2053/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s

  nginx:
    image: nginx:1.30.3-alpine@sha256:0d3b80406a13a767339fbe2f41406d6c7da727ab89cf8fae399e81f780f814d1
    container_name: 3x-ui-nginx
    network_mode: host
    restart: unless-stopped
    depends_on:
      x-ui:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        cert=/etc/letsencrypt/live/3x-ui-domains/fullchain.pem
        last_mtime=$$(stat -Lc %Y "$$cert")
        (
          while sleep 300; do
            current_mtime=$$(stat -Lc %Y "$$cert" 2>/dev/null || echo 0)
            if [ "$$current_mtime" != "$$last_mtime" ]; then
              nginx -t
              nginx -s reload
              last_mtime="$$current_mtime"
            fi
          done
        ) &
        exec nginx -g 'daemon off;'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro
      - ./www:/var/www/legacy:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && nc -z 127.0.0.1 443"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s

  certbot:
    image: certbot/certbot:v5.7.0@sha256:6bb19cff0b3972a69855686e0ccbd20b98dbfae2aa43845a5df48947ba1401b4
    container_name: 3x-ui-certbot
    network_mode: host
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        trap exit TERM INT
        while :; do
          certbot renew \
            --non-interactive \
            --webroot \
            --webroot-path /var/www/certbot
          sleep 12h & wait $$!
        done
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
      - ./certbot-lib:/var/lib/letsencrypt
      - ./certbot-logs:/var/log/letsencrypt
    security_opt:
      - no-new-privileges:true
