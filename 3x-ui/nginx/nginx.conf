user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    map $ssl_preread_server_name $tls_backend {
        panel.bigpandas.top 127.0.0.1:11443;
        sub.bigpandas.top   127.0.0.1:11443;
        default             127.0.0.1:10443;
    }

    server {
        listen 443 reuseport;
        listen [::]:443 reuseport;
        proxy_pass $tls_backend;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_socket_keepalive on;
        ssl_preread on;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name panel.bigpandas.top sub.bigpandas.top;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name proxy.bigpandas.top _;

        root /var/www/legacy;
        index index.html;

        location = /code.txt {
            default_type text/plain;
            add_header Cache-Control 'no-store, no-cache, must-revalidate, max-age=0' always;
            add_header Pragma 'no-cache' always;
            return 410 "gone\n";
        }

        location ^~ /downloads/ {
            try_files $uri =404;
            types {}
            default_type application/octet-stream;
            add_header Content-Disposition 'attachment' always;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control 'no-store, no-cache, must-revalidate, max-age=0' always;
            add_header Pragma 'no-cache' always;
            expires -1;
        }

        location ^~ /workspace-activation/api/ {
            access_log off;
            client_max_body_size 128k;
            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
        }

        location = /workspace-activation {
            return 301 /workspace-activation/;
        }

        location ^~ /workspace-activation/ {
            try_files $uri $uri/ /workspace-activation/index.html;
        }

        location / {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    server {
        listen 127.0.0.1:8080;
        server_name proxy.bigpandas.top;

        root /var/www/legacy;
        index index.html;

        location ^~ /workspace-activation/api/ {
            access_log off;
            client_max_body_size 128k;
            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 127.0.0.1:11443 ssl;
        http2 on;
        server_name panel.bigpandas.top;

        ssl_certificate /etc/letsencrypt/live/3x-ui-domains/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/3x-ui-domains/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location / {
            proxy_pass http://127.0.0.1:2053;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
        }
    }

    server {
        listen 127.0.0.1:11443 ssl;
        http2 on;
        server_name sub.bigpandas.top;

        ssl_certificate /etc/letsencrypt/live/3x-ui-domains/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/3x-ui-domains/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location ~ ^/(sub|json|clash)/ {
            proxy_pass http://127.0.0.1:2096;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        location / {
            return 404;
        }
    }
}
